version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      version-updates:
        applies-to: version-updates
        patterns: ["*"]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /mobile_server
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      version-updates:
        applies-to: version-updates
        patterns: ["*"]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      version-updates:
        applies-to: version-updates
        patterns: ["*"]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
