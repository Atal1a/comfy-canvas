name: CI

on:
  push:
  pull_request:

jobs:
  source-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r mobile_server/requirements.txt
      - run: npm ci
      - run: npm run audit:content
      - run: npm run build
      - run: python -m mobile_server.doctor --source-only --strict
      - run: python -m unittest discover -s mobile_server/tests -p "test_*.py"

  browser-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:e2e
